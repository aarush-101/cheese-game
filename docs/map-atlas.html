<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rat Race — Map Atlas</title><style>body{margin:0;background:#f6f4e8;color:#303b31;font:16px system-ui}main{max-width:1100px;margin:auto;padding:30px}h1{margin:0 0 8px}header{margin-bottom:24px}select,input{font:inherit;padding:9px;background:#fffdf4;border:1px solid #afb79b;border-radius:6px}label{display:inline-flex;gap:10px;align-items:center;margin:10px 20px 10px 0}canvas{width:100%;background:#e5e7d5;border-radius:14px}p{line-height:1.6}small{color:#6f7b66}.legend{display:flex;gap:24px;flex-wrap:wrap}</style><main><header><h1>Map atlas</h1><small>Rat Race · floor plans and connected routes</small></header><label>Arena <select id="map"></select></label><label>Floor <select id="floor"></select></label><label><input id="route" type="checkbox" checked> Show paths to poison</label><p id="info"></p><canvas width="1200" height="1000" id="atlas"></canvas><p class="legend"><span>🟨 Home</span><span>🟥 Rival</span><span>🟩 Poison</span><span>Blue: stairs and ramps</span><span>Gold: ladders</span></p><p><a href="/">Play Rat Race</a> · <a href="/?practice=1">Open the movement test course</a></p></main><script type="module">
import {MAPS} from '../src/maps.js';import {findPath} from '../src/navigation.js';
const $=id=>document.getElementById(id),ctx=$('atlas').getContext('2d');let routes=[];
for(const m of MAPS)$('map').add(new Option(m.name,m.id));
function select(){const m=MAPS.find(m=>m.id===$('map').value);$('floor').replaceChildren();const floors=[...new Set([0,m.minY,...m.rooms.map(r=>r.y),...m.pickups.map(p=>p.y)])].sort((a,b)=>a-b);for(const y of floors)$('floor').add(new Option(`${y} m`,y));$('floor').value=0;routes=m.pickups.map(p=>[m.bases[0],...findPath(m.bases[0],p,.55,m)]);draw();}
function draw(){const m=MAPS.find(m=>m.id===$('map').value),y=Number($('floor').value),scale=900/m.size,X=x=>600+x*scale,Z=z=>500+z*scale;ctx.clearRect(0,0,1200,1000);ctx.fillStyle='#d1d7bd';ctx.fillRect(X(-m.halfX),Z(-m.halfZ),m.width*scale,m.depth*scale);
const rect=(o,color)=>{ctx.fillStyle=color;ctx.fillRect(X(o.x-o.w/2),Z(o.z-o.d/2),o.w*scale,o.d*scale);};for(const t of m.terrain)if(t.y===y)rect(t,'#eee7d1');for(const p of m.platforms)if(Math.abs(p.y+p.h-y)<.1)rect(p,'#f9f4de');for(const r of m.ramps)if(r.low<=y&&r.high>=y)rect(r,'#819ca4');for(const o of m.obstacles)if(o.y<=y+1.8&&o.y+o.h>y+.1)rect(o,'#536653');
for(const r of m.rooms)if(r.y===y){ctx.font='11px system-ui';ctx.fillStyle='#66705e';ctx.textAlign='center';ctx.fillText(r.name,X(r.x),Z(r.z));}
for(const [points,color]of [[m.bases,'#e1af3c'],[m.pickups,'#88a936'],[m.ladders,'#bf9149']])for(const p of points){const height=p.y??p.bottom;if(Math.abs(height-y)>1&&!(p.top>=y&&p.bottom<=y))continue;ctx.fillStyle=p.id===1?'#cf705a':color;ctx.beginPath();ctx.arc(X(p.x),Z(p.z),p.name?5*scale:5,0,Math.PI*2);ctx.fill();}
if($('route').checked)for(const path of routes)for(let i=1;i<path.length;i++){const a=path[i-1],b=path[i];ctx.globalAlpha=Math.abs(a.y-y)<1?.8:.13;ctx.strokeStyle='#478d9e';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(X(a.x),Z(a.z));ctx.lineTo(X(b.x),Z(b.z));ctx.stroke();}ctx.globalAlpha=1;$('info').textContent=`${m.width} × ${m.depth} m · ${m.levels} layers · ${m.rooms.length} rooms/floor areas · ${m.ramps.length} stair flights · ${m.ladders.length} ladders. ${m.detail}`;}
$('map').onchange=select;$('floor').onchange=draw;$('route').onchange=draw;select();</script></html>
